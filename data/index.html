<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JetClock</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--border:#21262d;--border2:#30363d;
  --txt:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--blue-dim:#1f3a5f;
  --green:#3fb950;--accent:#79c0ff;--yellow:#e3b341;--red:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;font-size:14px}

header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:600;color:var(--blue)}
#dot{width:8px;height:8px;border-radius:50%;background:var(--border2)}
#dot.ok{background:var(--green)}
#statusLbl{margin-left:auto;font-size:12px;color:var(--muted)}
#statusLbl.ok{color:var(--green)}

.layout{display:flex;gap:20px;padding:20px;align-items:flex-start;max-width:1000px;margin:0 auto}
@media(max-width:700px){.layout{flex-direction:column}}

.preview-col{flex-shrink:0;width:200px}
.preview-col h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.preview-device{background:#0a0e14;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.preview-slots{padding:6px;display:flex;flex-direction:column;gap:5px}
.preview-card{
  height:54px;border-radius:7px;border:1px solid var(--border);
  background:#111620;cursor:pointer;padding:8px 10px;
  transition:border-color .15s,background .15s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
}
.preview-card:hover{border-color:var(--border2);background:#161e2a}
.preview-card.active{border-color:var(--blue)!important;background:var(--blue-dim)!important}
.preview-card .pc-fill{position:absolute;left:0;top:0;height:100%;background:var(--accent);opacity:.18;border-radius:7px;pointer-events:none}
.preview-card .pc-label{font-size:11px;color:var(--muted);z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-card .pc-value{font-size:12px;color:var(--txt);z-index:1}
.preview-card.empty .pc-label{color:var(--border2)}
.drop-hint{text-align:center;font-size:11px;color:var(--border2);margin-top:8px}

.config-col{flex:1;min-width:0}
.config-col h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.empty-state{text-align:center;padding:40px 0;color:var(--muted);font-size:13px}

.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.type-btn{
  background:var(--bg);border:1px solid var(--border);border-radius:7px;
  padding:10px 4px 8px;text-align:center;cursor:pointer;transition:all .15s;user-select:none;
}
.type-btn:hover{border-color:var(--border2);background:#131920}
.type-btn.active{border-color:var(--blue);background:var(--blue-dim)}
.type-btn .ti{font-size:16px;display:block;margin-bottom:3px;line-height:1}
.type-btn .tn{font-size:10px;color:var(--muted)}
.type-btn.active .tn{color:var(--accent)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13px;
  outline:none;transition:border-color .15s;-webkit-appearance:none;
}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field select option{background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.settings{max-width:1000px;margin:0 auto 20px;padding:0 20px}
.acc{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.acc-head{padding:13px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--surface);font-size:13px;font-weight:500;user-select:none}
.acc-head:hover{background:#1c2128}
.acc-chevron{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .2s}
.acc-body{padding:18px;border-top:1px solid var(--border);display:none}
.acc.open .acc-chevron{transform:rotate(180deg)}
.acc.open .acc-body{display:block}

footer{border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;max-width:1000px;margin:0 auto}
.btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--blue);color:#000}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}

#toast{position:fixed;bottom:18px;right:18px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;transform:translateY(80px);opacity:0;transition:all .25s;pointer-events:none;z-index:99}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<header>
  <div id="dot"></div>
  <h1>JetClock</h1>
  <span id="statusLbl">Loading…</span>
</header>

<div class="layout">
  <div class="preview-col">
    <h2>Side Panel</h2>
    <div class="preview-device">
      <div class="preview-slots" id="previewSlots"></div>
    </div>
    <div class="drop-hint">Click a slot to configure</div>
  </div>

  <div class="config-col">
    <h2 id="panelTitle">Configuration</h2>
    <div class="panel" id="panel">
      <div class="empty-state">← Select a slot to configure it</div>
    </div>
  </div>
</div>

<div class="settings">
  <div class="acc" id="acc-ha">
    <div class="acc-head" onclick="toggleAcc('acc-ha')">
      <span>⚡</span> Home Assistant <span class="acc-chevron">▾</span>
    </div>
    <div class="acc-body">
      <div class="field"><label>HA URL</label><input id="ha_url" placeholder="http://homeassistant.local:8123"></div>
      <div class="field"><label>Long-Lived Token</label><input id="ha_token" type="password" placeholder="eyJ…"></div>
      <div class="row2">
        <div class="field"><label>Temperature Entity</label><input id="temp_entity" placeholder="sensor.temperature"></div>
        <div class="field"><label>Humidity Entity</label><input id="humidity_entity" placeholder="sensor.humidity"></div>
      </div>
    </div>
  </div>
  <div class="acc" id="acc-loc">
    <div class="acc-head" onclick="toggleAcc('acc-loc')">
      <span>📍</span> Location &amp; Display <span class="acc-chevron">▾</span>
    </div>
    <div class="acc-body">
      <div class="row2">
        <div class="field"><label>Latitude</label><input id="home_lat" type="number" step="0.0001"></div>
        <div class="field"><label>Longitude</label><input id="home_lon" type="number" step="0.0001"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Radius (nm)</label><input id="radius_nm" type="number" min="5" max="200"></div>
        <div class="field"><label>Screen Bearing (°)</label><input id="screen_bearing" type="number" min="0" max="359"></div>
      </div>
      <div class="field"><label>Timezone (POSIX)</label><input id="timezone" placeholder="GMT0BST,M3.5.0/1,M10.5.0"></div>
      <div class="field"><label>Theme</label>
        <select id="theme">
          <option>Midnight</option><option>Warm Brown</option>
          <option>Forest</option><option>iOS</option>
        </select>
      </div>
    </div>
  </div>
  <div class="acc" id="acc-disp">
    <div class="acc-head" onclick="toggleAcc('acc-disp')">
      <span>☀</span> Display Brightness (HA) <span class="acc-chevron">▾</span>
    </div>
    <div class="acc-body">
      <div class="row2">
        <div class="field"><label>Brightness Entity</label><input id="display_brightness_entity" placeholder="input_number.jetclock_brightness"></div>
        <div class="field"><label>Power Entity</label><input id="display_power_entity" placeholder="input_boolean.jetclock_power"></div>
      </div>
    </div>
  </div>
  <div class="acc" id="acc-wifi">
    <div class="acc-head" onclick="toggleAcc('acc-wifi')">
      <span>📶</span> Wi-Fi <span class="acc-chevron">▾</span>
    </div>
    <div class="acc-body">
      <div class="row2">
        <div class="field"><label>Network</label><input id="wifi_ssid"></div>
        <div class="field"><label>Password</label><input id="wifi_password" type="password"></div>
      </div>
    </div>
  </div>
</div>

<footer>
  <button class="btn btn-ghost" onclick="loadConfig()">Reload</button>
  <button class="btn btn-primary" onclick="saveConfig()">Save &amp; Reboot</button>
</footer>
<div id="toast"></div>

<script>
const TYPES=[
  {id:0,name:'Empty',  icon:'—',  color:'#30363d'},
  {id:1,name:'Toggle', icon:'⏻', color:'#58a6ff'},
  {id:2,name:'Slider', icon:'◐', color:'#7c3aed'},
  {id:3,name:'Sensor', icon:'⊙', color:'#3fb950'},
  {id:4,name:'Action', icon:'▶', color:'#e3b341'},
  {id:5,name:'Cover',  icon:'▤', color:'#58a6ff'},
  {id:6,name:'Light',  icon:'◑', color:'#f0c060'},
  {id:7,name:'Climate',icon:'◉', color:'#f85149'},
  {id:8,name:'Lock',   icon:'⊠', color:'#da3633'},
  {id:9,name:'Select', icon:'≡', color:'#8b949e'},
];
const EXTRA={2:['min_max'],3:['attribute','unit'],4:['service'],6:['attribute'],7:['min_max','unit'],9:['service']};

let cfg={slots:[]}, sel=-1;

function initSlots(){
  for(let i=0;i<5;i++)
    cfg.slots[i]=cfg.slots[i]||{type:0,entity_id:'',label:'',domain:'',service:'',attribute:'',unit:'',min:0,max:100};
}

function buildPreview(){
  const el=document.getElementById('previewSlots');
  el.innerHTML='';
  for(let i=0;i<5;i++){
    const s=cfg.slots[i]||{};
    const t=TYPES[s.type||0];
    const empty=!s.entity_id||s.type===0;
    const hasFill=s.type===2||s.type===6;
    const d=document.createElement('div');
    d.className='preview-card'+(empty?' empty':'')+(i===sel?' active':'');
    d.innerHTML=
      (hasFill?'<div class="pc-fill" style="width:60%"></div>':'')+
      '<div class="pc-label">'+(s.label||(empty?'Empty slot':''))+'</div>'+
      (empty?'':'<div class="pc-value" style="color:'+t.color+'">'+t.icon+' '+t.name+'</div>');
    d.onclick=()=>selectSlot(i);
    el.appendChild(d);
  }
}

function selectSlot(i){
  sel=i; buildPreview();
  document.getElementById('panelTitle').textContent='Slot '+(i+1);
  const s=cfg.slots[i];
  document.getElementById('panel').innerHTML=
    '<div class="type-grid">'+TYPES.map(t=>
      '<div class="type-btn'+(s.type===t.id?' active':'')+'" onclick="setType('+i+','+t.id+')">'+
      '<span class="ti">'+t.icon+'</span><div class="tn">'+t.name+'</div></div>'
    ).join('')+'</div>'+
    '<div class="field"><label>Entity ID</label>'+
    '<input value="'+esc(s.entity_id)+'" placeholder="domain.entity_name" oninput="setF('+i+',\'entity_id\',this.value)"></div>'+
    '<div class="field"><label>Display Label</label>'+
    '<input value="'+esc(s.label)+'" placeholder="My Light" oninput="setF('+i+',\'label\',this.value)"></div>'+
    '<div id="xf">'+extraHTML(i)+'</div>';
}

function extraHTML(i){
  const s=cfg.slots[i], ex=EXTRA[s.type]||[];
  let h='';
  if(ex.includes('min_max'))
    h+='<div class="row2"><div class="field"><label>Min</label><input type="number" value="'+(s.min??0)+'" oninput="setF('+i+',\'min\',+this.value)"></div>'+
       '<div class="field"><label>Max</label><input type="number" value="'+(s.max??100)+'" oninput="setF('+i+',\'max\',+this.value)"></div></div>';
  if(ex.includes('attribute'))
    h+='<div class="field"><label>Attribute (optional)</label><input value="'+esc(s.attribute)+'" placeholder="brightness" oninput="setF('+i+',\'attribute\',this.value)"></div>';
  if(ex.includes('unit'))
    h+='<div class="field"><label>Unit</label><input value="'+esc(s.unit)+'" placeholder="°C" oninput="setF('+i+',\'unit\',this.value)"></div>';
  if(ex.includes('service'))
    h+='<div class="field"><label>Service Override</label><input value="'+esc(s.service)+'" placeholder="scene.turn_on" oninput="setF('+i+',\'service\',this.value)"></div>';
  return h;
}

function setType(i,type){cfg.slots[i].type=type;deriveD(i);selectSlot(i);buildPreview()}
function setF(i,k,v){cfg.slots[i][k]=v;if(k==='entity_id')deriveD(i);if(k==='label')buildPreview()}
function deriveD(i){const e=cfg.slots[i].entity_id;if(e&&e.includes('.'))cfg.slots[i].domain=e.split('.')[0]}

function applyConfig(c){
  cfg=c; initSlots();
  const g=(id,v)=>document.getElementById(id).value=v||'';
  g('ha_url',c.ha_url||'http://homeassistant.local:8123');
  g('ha_token',c.ha_token);g('temp_entity',c.temp_entity);
  g('humidity_entity',c.humidity_entity);g('home_lat',c.home_lat);
  g('home_lon',c.home_lon);
  document.getElementById('radius_nm').value=c.radius_nm||25;
  document.getElementById('screen_bearing').value=c.screen_bearing||0;
  document.getElementById('theme').value=c.theme||'Midnight';
  g('timezone',c.timezone||'GMT0BST,M3.5.0/1,M10.5.0');
  g('display_brightness_entity',c.display_brightness_entity);
  g('display_power_entity',c.display_power_entity);
  g('wifi_ssid',c.wifi_ssid);g('wifi_password',c.wifi_password);
  buildPreview();
}

function collect(){
  const v=id=>document.getElementById(id).value;
  return{wifi_ssid:v('wifi_ssid'),wifi_password:v('wifi_password'),
    home_lat:+v('home_lat'),home_lon:+v('home_lon'),
    radius_nm:+v('radius_nm'),screen_bearing:+v('screen_bearing'),
    ha_url:v('ha_url'),ha_token:v('ha_token'),
    temp_entity:v('temp_entity'),humidity_entity:v('humidity_entity'),
    theme:v('theme'),
    timezone:v('timezone'),
    display_brightness_entity:v('display_brightness_entity'),
    display_power_entity:v('display_power_entity'),
    slots:cfg.slots};
}

async function loadConfig(){
  try{const r=await fetch('/config');if(!r.ok)throw new Error('HTTP '+r.status);
    applyConfig(await r.json());setStatus(true,'Connected');}
  catch(e){setStatus(false,e.message);}
}

async function saveConfig(){
  const cfg=collect();
  if(cfg.home_lat!==0&&(cfg.home_lat<-90||cfg.home_lat>90))
    return toast('Latitude must be between -90 and 90 (decimal degrees, e.g. 53.3652)',true);
  if(cfg.home_lon!==0&&(cfg.home_lon<-180||cfg.home_lon>180))
    return toast('Longitude must be between -180 and 180 (decimal degrees, e.g. -1.3854)',true);
  try{const r=await fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
    if(!r.ok)throw new Error('HTTP '+r.status);toast('Saved — rebooting…');}
  catch(e){toast(e.message,true);}
}

function setStatus(ok,msg){
  document.getElementById('dot').className=ok?'ok':'';
  const el=document.getElementById('statusLbl');el.textContent=msg;el.className=ok?'ok':'';
}
let tt;
function toast(msg,err){const el=document.getElementById('toast');el.textContent=msg;el.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>el.className='',3000)}
function toggleAcc(id){document.getElementById(id).classList.toggle('open')}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}

initSlots();
buildPreview();
loadConfig();
</script>
</body>
</html>
