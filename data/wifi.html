<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JetClock — Wi-Fi setup</title>
<style>
  :root {
    --bg:     #0d1117;
    --card:   #161b22;
    --border: #30363d;
    --text:   #e6edf3;
    --muted:  #8b949e;
    --accent: #58a6ff;
    --green:  #3fb950;
    --red:    #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .logo h1 { font-size: 22px; font-weight: 800; }
  .logo p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .step {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .step strong { color: var(--text); }

  .fields { display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 16px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }

  .btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    padding: 13px;
    width: 100%;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .status {
    border-radius: 8px;
    font-size: 14px;
    padding: 12px 16px;
    line-height: 1.5;
    display: none;
    text-align: center;
  }
  .status.ok  { background: rgba(63,185,80,0.12); color: var(--green); display: block; }
  .status.err { background: rgba(248,81,73,0.12);  color: var(--red);   display: block; }
  .status.info{ background: rgba(88,166,255,0.10); color: var(--accent); display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">✈</div>
    <div>
      <h1>JetClock</h1>
      <p>Step 1 of 2 — Wi-Fi</p>
    </div>
  </div>

  <div class="step">
    Enter your home Wi-Fi details. Once connected, finish the setup from
    <strong>any browser</strong> on your home network at
    <strong>http://jetclock.local</strong>
  </div>

  <div class="fields">
    <label>
      Network name (SSID)
      <input id="ssid" type="text" autocomplete="off" spellcheck="false" placeholder="MyHomeNetwork">
    </label>
    <label>
      Password
      <input id="pass" type="password" autocomplete="new-password" placeholder="••••••••">
    </label>
  </div>

  <div id="status" class="status"></div>

  <button class="btn" id="btn" onclick="save()">Connect →</button>
</div>

<script>
async function save() {
  const ssid = document.getElementById('ssid').value.trim();
  const pass = document.getElementById('pass').value;
  const status = document.getElementById('status');
  const btn = document.getElementById('btn');

  if (!ssid) {
    show(status, 'err', 'Please enter your network name.');
    return;
  }

  btn.disabled = true;
  show(status, 'info', 'Saving…');

  try {
    const res = await fetch('/wifi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ wifi_ssid: ssid, wifi_password: pass })
    });
    const data = await res.json();
    if (data.ok) {
      show(status, 'ok',
        'Saved! The display is connecting to your network.\n\n' +
        'Once it\'s connected, open http://jetclock.local on any device to finish setup.');
    } else {
      show(status, 'err', 'Save failed: ' + JSON.stringify(data));
      btn.disabled = false;
    }
  } catch (e) {
    show(status, 'err', 'Error: ' + e.message);
    btn.disabled = false;
  }
}

function show(el, type, msg) {
  el.className = 'status ' + type;
  el.style.whiteSpace = 'pre-wrap';
  el.textContent = msg;
}
</script>
</body>
</html>
