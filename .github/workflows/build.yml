name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Build filesystem image
        run: pio run --target buildfs

      - name: Collect artifacts
        run: |
          BUILD=.pio/build/guition-4848s040
          mkdir -p gh-pages
          cp $BUILD/firmware.bin    gh-pages/
          cp $BUILD/bootloader.bin  gh-pages/
          cp $BUILD/partitions.bin  gh-pages/
          cp $BUILD/littlefs.bin    gh-pages/
          cp docs/index.html        gh-pages/
          cp docs/manifest.json     gh-pages/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
